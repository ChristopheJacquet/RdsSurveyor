name: Build and Release

on:
  # Trigger on manual workflow dispatch
  workflow_dispatch:

  # Trigger on push to any branch
  push:
    branches:
      - '**'

  # Trigger when a release is created
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Build JAR with Gradle
        working-directory: ./RDSSurveyor
        run: gradle jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: rdssurveyor-jar
          path: RDSSurveyor/build/libs/rdssurveyor.jar
          if-no-files-found: error

  release:
    # Only run release job on:
    # - manual dispatch
    # - when a release is created
    # - when pushing to master branch
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')

    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: rdssurveyor-jar

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v1
        with:
          # Use existing tag if triggered by release, otherwise create/update 'latest' tag
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}
          name: ${{ github.event_name == 'release' && github.event.release.name || format('Latest Build - {0}', steps.date.outputs.date) }}
          body: |
            ${{ github.event_name == 'release' && github.event.release.body || format('Automated build from commit {0}', github.sha) }}

            Built from: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
          files: rdssurveyor.jar
          draft: false
          prerelease: ${{ github.event_name != 'release' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
